<div class="container mx-auto">
  <app-header [cart]="cart()"/>
  <h3> {{ cart().length }}</h3>
  <div class="grid grid-cols-4 gap-8">
    <app-product 
    *ngFor="let product of products()"
    [product]="product" 
    (addToCart)="addToCart($event)" />
  </div>
